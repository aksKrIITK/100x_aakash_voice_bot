version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aakash_voicebot
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: aakash_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aakash_voicebot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
